<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Резиновая утка</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: radial-gradient(120% 90% at 50% 40%, #151a26 0%, #080a10 100%); }
  body { display: grid; place-items: center; }
  #duck {
    position: relative;
    display: inline-block;
    background: transparent;
    border: 0;
    width: clamp(150px, 34vw, 260px);
    height: clamp(150px, 34vw, 260px);
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    filter: drop-shadow(0 20px 34px rgba(0, 0, 0, .55));
    transition: transform .08s ease;
  }
  .duck-fallback {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: clamp(70px, 18vw, 120px);
    line-height: 1;
  }
  .duck-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
  }
  #duck:active { transform: scale(.88) rotate(3deg); }
  #duck.pop { animation: pop .3s ease-out; }
  @keyframes pop {
    0%   { transform: scale(1.06) rotate(-4deg); }
    45%  { transform: scale(.86) rotate(5deg); }
    100% { transform: scale(1) rotate(0); }
  }
  #particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
  }
  .hint {
    position: fixed;
    bottom: 24px;
    left: 0;
    right: 0;
    text-align: center;
    color: #4c5568;
    font: 13.5px/1.6 system-ui, "Segoe UI", sans-serif;
    letter-spacing: .04em;
    user-select: none;
  }

  /* ---------- Ачивки ---------- */
  .achv-list {
    position: fixed;
    left: clamp(0px, 2vw, 16px);
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: calc(100vh - 30px);
    overflow-y: auto;
    overflow-x: hidden;
    padding: 34px 28px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, .18) transparent;
    z-index: 20;
  }
  .achv-list::-webkit-scrollbar {
    width: 6px;
  }
  .achv-list::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, .18);
    border-radius: 4px;
  }
  .achv-card {
    position: relative;
    width: min(212px, 88vw);
    height: 96px;
    border-radius: 24px;
    background: #313742;
    border: 1px solid #3e4757;
    display: grid;
    place-items: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .3s ease, border-color .3s ease, box-shadow .3s ease, transform .1s ease;
  }
  .achv-card:active {
    transform: scale(.98);
  }
  .achv-card.unlocked {
    background: #ffd24d;
    border-color: #ffe99e;
    box-shadow: 0 0 0 3px rgba(255, 214, 77, .3), 0 0 16px 2px rgba(255, 214, 77, .42), 0 8px 18px rgba(0, 0, 0, .3);
    animation: achv-glow 2.4s ease-in-out 1s infinite;
  }
  @keyframes achv-glow {
    0%, 100% {
      box-shadow: 0 0 0 3px rgba(255, 214, 77, .25), 0 0 14px 2px rgba(255, 214, 77, .35), 0 8px 18px rgba(0, 0, 0, .3);
    }
    50% {
      box-shadow: 0 0 0 4px rgba(255, 214, 77, .45), 0 0 22px 3px rgba(255, 214, 77, .6), 0 8px 18px rgba(0, 0, 0, .3);
    }
  }
  .achv-card.flash {
    animation: card-flash .5s cubic-bezier(.2, .9, .3, 1.35) .25s;
  }
  @keyframes card-flash {
    0%   { transform: scale(.88); }
    60%  { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  .achv-padlock {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 38px;
    line-height: 1;
    filter: grayscale(.9) opacity(.85);
    pointer-events: none;
    user-select: none;
  }
  .achv-info {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 4px;
    padding: 0 14px;
    color: #2b2409;
    opacity: 0;
    pointer-events: none;
  }
  .achv-info.shown {
    opacity: 1;
    animation: info-in .45s ease-out;
  }
  @keyframes info-in {
    0%   { opacity: 0; transform: translateY(7px) scale(.95); }
    100% { opacity: 1; transform: none; }
  }
  .achv-name {
    font: 700 15.5px/1.3 system-ui, "Segoe UI", sans-serif;
  }
  .achv-desc {
    font: 13px/1.45 system-ui, "Segoe UI", sans-serif;
    color: #6a5b14;
  }
  .reset-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 20;
    font: 12px/1.25 system-ui, "Segoe UI", sans-serif;
    color: #8b93a7;
    background: rgba(255, 255, 255, .05);
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 9px;
    padding: 8px 12px;
    cursor: pointer;
    transition: color .18s, background .18s, border-color .18s, transform .12s;
  }
  .reset-btn:hover {
    color: #ffd24d;
    background: rgba(255, 210, 77, .08);
    border-color: rgba(255, 210, 77, .35);
  }
  .reset-btn:active {
    transform: scale(.96);
  }

  /* ---------- Панель валюты (Дакли) ---------- */
  .duckles-bar {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(21, 26, 38, 0.78);
    border: 1px solid rgba(255, 210, 77, 0.28);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 8px 18px;
    border-radius: 999px;
    color: #c9d1d9;
    font: 600 15.5px/1.3 system-ui, "Segoe UI", sans-serif;
    letter-spacing: .02em;
    user-select: none;
    z-index: 25;
    white-space: nowrap;
  }
  .duckles-val {
    color: #ffd24d;
    font-size: 18.5px;
    font-weight: 800;
    transition: transform .08s ease;
    display: inline-block;
  }
  .duckles-val.bump {
    transform: scale(1.22);
  }

  @media (max-width: 560px) {
    .duckles-bar { top: 10px; font-size: 13px; padding: 6px 12px; }
    .duckles-val { font-size: 15px; }
    .achv-list { top: 48px; left: 0; transform: none; max-height: calc(100vh - 90px); padding: 24px 16px; }
    .achv-card { width: min(208px, calc(100vw - 32px)); height: 86px; border-radius: 20px; }
    .achv-padlock { font-size: 32px; }
    .achv-name { font-size: 14.5px; }
    .achv-desc { font-size: 12px; }
  }
</style>
</head>
<body>

  <div class="duckles-bar" id="ducklesBar">Даклей заработано: <span class="duckles-val" id="ducklesVal">0</span></div>

  <button id="duck" aria-label="Крякнуть">
    <span class="duck-fallback">🦆</span>
    <img class="duck-img" id="duckImg" src="https://png.klev.club/uploads/posts/2024-04/png-klev-club-duug-p-rezinovaya-utka-png-14.png" alt="Резиновая утка"
         onload="document.querySelector('.duck-fallback').style.display='none'"
         onerror="this.style.display='none'; document.querySelector('.duck-fallback').style.display='grid'">
  </button>

  <div class="achv-list" id="achvList"></div>

  <canvas id="particles"></canvas>
  <div class="hint">Жмякни крякалку</div>
  <button id="resetBtn" class="reset-btn" aria-label="Сбросить все ачивки">Сбросить все ачивки</button>

<script>
  const GRAVITY = 1000;      // px/s²
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  const duck = document.getElementById('duck');
  const particles = [];
  let audioCtx = null;

  const STORAGE_PREFIX = 'duck-achv-';
  const QUACK_KEY = 'duck-quack-count';
  const DUCKLES_KEY = 'duck-duckles';
  const HINT_KEY = 'duck-hint-count';
  const KEY_PRESSED_KEY = 'duck-key-pressed';
  const SEQ_DONE_KEY = 'duck-seq-done';
  const LOCKED_CLICKED_KEY = 'duck-locked-clicked';

  let quackCount = parseInt(localStorage.getItem(QUACK_KEY) || '0', 10) || 0;
  let duckles = parseInt(localStorage.getItem(DUCKLES_KEY) ?? quackCount, 10) || 0;
  let hintCount = parseInt(localStorage.getItem(HINT_KEY) || '0', 10) || 0;
  let keyPressed = localStorage.getItem(KEY_PRESSED_KEY) === '1';
  let duckSeqDone = localStorage.getItem(SEQ_DONE_KEY) === '1';
  let lockedCardClicked = localStorage.getItem(LOCKED_CLICKED_KEY) === '1';

  const ducklesVal = document.getElementById('ducklesVal');
  function updateDuckles(bump = false) {
    if (ducklesVal) {
      ducklesVal.textContent = duckles;
      if (bump) {
        ducklesVal.classList.remove('bump');
        void ducklesVal.offsetWidth;
        ducklesVal.classList.add('bump');
      }
    }
  }

  /* ---------- ачивки ---------- */
  const ACHIEVEMENTS = [
    {
      id: 'first-quack',
      name: 'Первый кря!',
      desc: 'Нажмите один раз на утку',
      done: false,
      check: () => quackCount >= 1,
    },
    {
      id: 'hundred-quacks',
      name: 'Делать нечего?',
      desc: 'Нажмите 100! раз на утку',
      done: false,
      check: () => quackCount >= 100,
    },
    {
      id: 'mimambo',
      name: 'Мимамбо!',
      desc: 'Нажать, но не туда...',
      done: false,
      check: () => hintCount >= 1,
    },
    {
      id: 'type-key',
      name: 'Печатать не нужно!',
      desc: 'Или нужно?',
      done: false,
      check: () => keyPressed,
    },
    {
      id: 'i-am-duck',
      name: 'Я и есть утка',
      desc: 'КРЯ!',
      done: false,
      check: () => duckSeqDone,
    },
    {
      id: 'hack-locked',
      name: 'Взлом жопы!',
      desc: 'Так просто?',
      done: false,
      check: () => lockedCardClicked,
    },
  ];

  function buildAchievementCards() {
    const list = document.getElementById('achvList');
    ACHIEVEMENTS.forEach((a) => {
      try {
        a.done = localStorage.getItem(STORAGE_PREFIX + a.id) === '1';
      } catch (e) {
        a.done = false;
      }
      const card = document.createElement('div');
      card.id = 'achv-card-' + a.id;
      card.className = 'achv-card' + (a.done ? ' unlocked' : '');
      card.innerHTML =
        '<span class="achv-padlock" id="achv-padlock-' + a.id + '" aria-hidden="true">🔒</span>' +
        '<div class="achv-info' + (a.done ? ' shown' : '') + '" id="achv-info-' + a.id + '" aria-live="polite">' +
          '<div class="achv-name">' + a.name + '</div>' +
          '<div class="achv-desc">' + a.desc + '</div>' +
        '</div>';
      list.appendChild(card);
      if (a.done) document.getElementById('achv-padlock-' + a.id).style.display = 'none';
    });
  }

  function resetAchievements() {
    const list = document.getElementById('achvList');
    list.innerHTML = '';
    quackCount = 0;
    duckles = 0;
    hintCount = 0;
    keyPressed = false;
    duckSeqDone = false;
    duckSeqIndex = 0;
    lockedCardClicked = false;
    try {
      localStorage.removeItem(QUACK_KEY);
      localStorage.removeItem(DUCKLES_KEY);
      localStorage.removeItem(HINT_KEY);
      localStorage.removeItem(KEY_PRESSED_KEY);
      localStorage.removeItem(SEQ_DONE_KEY);
      localStorage.removeItem(LOCKED_CLICKED_KEY);
    } catch (e) {}
    ACHIEVEMENTS.forEach((a) => {
      a.done = false;
      try { localStorage.removeItem(STORAGE_PREFIX + a.id); } catch (e) {}
    });
    buildAchievementCards();
    updateDuckles();
  }

  function tryUnlock() {
    ACHIEVEMENTS.forEach((a, i) => {
      if (!a.done && a.check()) unlockAchievement(i);
    });
  }

  function unlockAchievement(i) {
    const a = ACHIEVEMENTS[i];
    a.done = true;
    try {
      localStorage.setItem(STORAGE_PREFIX + a.id, '1');
    } catch (e) { /* без сохранения тоже ок */ }

    const card = document.getElementById('achv-card-' + a.id);
    const padlock = document.getElementById('achv-padlock-' + a.id);
    const info = document.getElementById('achv-info-' + a.id);
    const r = padlock.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;

    // опыт: звук как в Minecraft
    xpSound();

    // окно подсвечивается жёлтым; название и описание появляются чуть позже
    card.classList.add('unlocked');
    card.classList.add('flash');
    card.addEventListener('animationend', () => card.classList.remove('flash'), { once: true });
    setTimeout(() => info.classList.add('shown'), 220);

    // замок отлетает как «Кря»
    padlock.style.display = 'none';
    const ang = 0.15 + Math.random() * Math.PI * 0.85;
    const speed = 240 + Math.random() * 260;
    particles.push({
      x: cx,
      y: cy,
      vx: Math.cos(ang) * speed,
      vy: -Math.sin(ang) * speed,
      size: 44,
      alpha: 1,
      hue: 0,
      sat: 0,
      light: 50,
      fly: true,
      rot: 0,
      rotSpeed: (Math.random() - 0.5) * 14,
    });
  }

  function xpSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t0 = audioCtx.currentTime + 0.02;
      // короткий восходящий арпеджио — «пинг-пинг-пинг», как при сборе опыта
      const notes = [523.25, 659.25, 783.99, 880.0, 1046.5];
      notes.forEach((f, n) => {
        const st = t0 + n * 0.068;
        const o = audioCtx.createOscillator();
        o.type = 'square';
        o.frequency.setValueAtTime(f, st);
        o.frequency.exponentialRampToValueAtTime(f * 0.9, st + 0.045);
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.0001, st);
        g.gain.exponentialRampToValueAtTime(0.08, st + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, st + 0.055);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start(st);
        o.stop(st + 0.07);
      });
    } catch (e) { /* без звука тоже ок */ }
  }

  buildAchievementCards();
  tryUnlock();
  updateDuckles();

  /* ---------- canvas ---------- */
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width  = innerWidth  * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  /* ---------- звук "кря" ---------- */
  function quack() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc = (type, f0, f1, dur, gain) => {
        const o = audioCtx.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(f0, t);
        o.frequency.exponentialRampToValueAtTime(f1, t + dur);
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(gain, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.04);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + dur + 0.08);
      };
      // базовой "квак": падение высоты + щепетотка
      osc('sawtooth', 340 + Math.random() * 130, 70, 0.16, 0.10);
      osc('square',   560 + Math.random() * 160, 130, 0.11, 0.05);
      const nLen = Math.max(1, 0.02 * audioCtx.sampleRate | 0);
      const buf = audioCtx.createBuffer(1, nLen, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < nLen; i++) d[i] = (Math.random() * 2 - 1) * 0.8;
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.06, t);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.025);
      src.connect(ng); ng.connect(audioCtx.destination);
      src.start(t);
    } catch (e) { /* без звука тоже ок */ }
  }

  /* ---------- частицы "Кря" ---------- */
  function spawn(x, y) {
    const n = 8 + (Math.random() * 8 | 0);          // 8..15 за раз (+10%)
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI;          // 0°..180° — весь верхний разброс
      const speed = 90 + Math.random() * 380;       // случайная начальная скорость
      particles.push({
        x: x + (Math.random() - .5) * 26,
        y: y + (Math.random() - .5) * 18,
        vx: Math.cos(ang) * speed,
        vy: -Math.sin(ang) * speed,
        size: 14 + Math.random() * 32,              // случайный размер
        alpha: .18 + Math.random() * .72,           // уменьшенный нижний диапазон прозрачности (0.18..0.90)
        hue: Math.random() * 360 | 0,               // случайный цвет
        sat: 65 + Math.random() * 35 | 0,
        light: 55 + Math.random() * 22 | 0,
      });
    }
  }

  duck.addEventListener('click', () => {
    const r = duck.getBoundingClientRect();
    // анимация "подпрыгивания" — перезапуск
    duck.classList.remove('pop');
    void duck.offsetWidth;
    duck.classList.add('pop');
    quack();
    quackCount++;
    duckles += 1;
    try {
      localStorage.setItem(QUACK_KEY, String(quackCount));
      localStorage.setItem(DUCKLES_KEY, String(duckles));
    } catch (e) {}
    updateDuckles(true);
    // старт из клюва/горловины утки
    spawn(r.left + r.width / 2, r.top + r.height * 0.58);
    // проверка ачивок
    tryUnlock();
  });

  // клик по нижней надписи — «не туда»: текст не меняется, просто считаем и проверяем ачивку
  const hint = document.querySelector('.hint');
  hint.addEventListener('click', () => {
    hintCount++;
    try { localStorage.setItem(HINT_KEY, String(hintCount)); } catch (e) {}
    tryUnlock();
  });

  // клик по заблокированной ачивке — ачивка "Взлом жопы!"
  document.getElementById('achvList').addEventListener('click', (e) => {
    const card = e.target.closest('.achv-card');
    if (card && !card.classList.contains('unlocked')) {
      lockedCardClicked = true;
      try { localStorage.setItem(LOCKED_CLICKED_KEY, '1'); } catch (err) {}
      tryUnlock();
    }
  });

  // клавиатурные ачивки: "Печатать не нужно!" и "Я и есть утка"
  const DUCK_SEQUENCE = [
    { code: 'KeyR', keys: ['r', 'к'] },
    { code: 'KeyH', keys: ['h', 'р'] },
    { code: 'KeyZ', keys: ['z', 'я'] },
  ];
  let duckSeqIndex = 0;

  function isFunctionalKey(e) {
    if (/^F\d+$/.test(e.key)) return true;
    const functional = [
      'Shift', 'Control', 'Alt', 'Meta', 'AltGraph',
      'CapsLock', 'Tab', 'Escape', 'NumLock', 'ScrollLock',
      'Pause', 'PrintScreen', 'ContextMenu'
    ];
    return functional.includes(e.key);
  }

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;

    // 1. "Печатать не нужно!" — любая нефункциональная клавиша
    if (!isFunctionalKey(e)) {
      if (!keyPressed) {
        keyPressed = true;
        try { localStorage.setItem(KEY_PRESSED_KEY, '1'); } catch (err) {}
        tryUnlock();
      }
    }

    // 2. "Я и есть утка" — последовательность R H Z (К Р Я)
    const pressedKey = e.key.toLowerCase();
    const step = DUCK_SEQUENCE[duckSeqIndex];
    if (e.code === step.code || step.keys.includes(pressedKey)) {
      duckSeqIndex++;
      if (duckSeqIndex === DUCK_SEQUENCE.length) {
        duckSeqDone = true;
        duckSeqIndex = 0;
        try { localStorage.setItem(SEQ_DONE_KEY, '1'); } catch (err) {}
        tryUnlock();
      }
    } else {
      if (e.code === DUCK_SEQUENCE[0].code || DUCK_SEQUENCE[0].keys.includes(pressedKey)) {
        duckSeqIndex = 1;
      } else {
        duckSeqIndex = 0;
      }
    }
  });

  // сброс всех ачивок
  document.getElementById('resetBtn').addEventListener('click', resetAchievements);

  /* ---------- цикл ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    ctx.clearRect(0, 0, innerWidth, innerHeight);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += GRAVITY * dt;          // тяжение
      p.x  += p.vx * dt;
      p.y  += p.vy * dt;
      if (p.fly) p.rot += p.rotSpeed * dt;

      // улетели за экран — убираем
      if (p.x < -60 || p.x > innerWidth + 60 || p.y > innerHeight + 80 || p.y < -200) {
        particles.splice(i, 1);
        continue;
      }

      if (p.fly) {
        // замок летит по той же траектории, что и «Кря»
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = p.size + 'px "Segoe UI Emoji", "Segoe UI Symbol", system-ui';
        ctx.fillText('🔒', 0, 0);
        ctx.restore();
      } else {
        ctx.font = 'bold ' + p.size + 'px "Segoe UI", system-ui, sans-serif';
        ctx.fillStyle = 'hsla(' + p.hue + ', ' + p.sat + '%, ' + p.light + '%, ' + p.alpha + ')';
        ctx.fillText('Кря', p.x, p.y);
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
