<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Резиновая утка</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: radial-gradient(120% 90% at 50% 40%, #151a26 0%, #080a10 100%); }
  body { display: grid; place-items: center; }
  #duck {
    position: relative;
    display: inline-block;
    background: transparent;
    border: 0;
    width: clamp(150px, 34vw, 260px);
    height: clamp(150px, 34vw, 260px);
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    filter: drop-shadow(0 20px 34px rgba(0, 0, 0, .55));
    transition: transform .08s ease;
  }
  .duck-fallback {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: clamp(70px, 18vw, 120px);
    line-height: 1;
  }
  .duck-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
  }
  #duck:active { transform: scale(.88) rotate(3deg); }
  #duck.pop { animation: pop .3s ease-out; }
  @keyframes pop {
    0%   { transform: scale(1.06) rotate(-4deg); }
    45%  { transform: scale(.86) rotate(5deg); }
    100% { transform: scale(1) rotate(0); }
  }
  #particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
  }
  .hint {
    position: fixed;
    bottom: 24px;
    left: 0;
    right: 0;
    text-align: center;
    color: #4c5568;
    font: 13.5px/1.6 system-ui, "Segoe UI", sans-serif;
    letter-spacing: .04em;
    user-select: none;
  }

  /* ---------- Ачивки ---------- */
  .achv-list {
    position: fixed;
    left: clamp(0px, 2vw, 16px);
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: calc(100vh - 30px);
    overflow-y: auto;
    overflow-x: hidden;
    padding: 34px 28px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, .18) transparent;
    z-index: 20;
  }
  .achv-list::-webkit-scrollbar {
    width: 6px;
  }
  .achv-list::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, .18);
    border-radius: 4px;
  }
  .achv-card {
    position: relative;
    width: min(212px, 88vw);
    height: 96px;
    border-radius: 24px;
    background: #313742;
    border: 1px solid #3e4757;
    display: grid;
    place-items: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .3s ease, border-color .3s ease, box-shadow .3s ease, transform .1s ease;
  }
  .achv-card:active {
    transform: scale(.98);
  }
  .achv-card.unlocked {
    background: #ffd24d;
    border-color: #ffe99e;
    box-shadow: 0 0 0 3px rgba(255, 214, 77, .3), 0 0 16px 2px rgba(255, 214, 77, .42), 0 8px 18px rgba(0, 0, 0, .3);
    animation: achv-glow 2.4s ease-in-out 1s infinite;
  }
  @keyframes achv-glow {
    0%, 100% {
      box-shadow: 0 0 0 3px rgba(255, 214, 77, .25), 0 0 14px 2px rgba(255, 214, 77, .35), 0 8px 18px rgba(0, 0, 0, .3);
    }
    50% {
      box-shadow: 0 0 0 4px rgba(255, 214, 77, .45), 0 0 22px 3px rgba(255, 214, 77, .6), 0 8px 18px rgba(0, 0, 0, .3);
    }
  }
  .achv-card.flash {
    animation: card-flash .5s cubic-bezier(.2, .9, .3, 1.35) .25s;
  }
  @keyframes card-flash {
    0%   { transform: scale(.88); }
    60%  { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  .achv-padlock {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 38px;
    line-height: 1;
    filter: grayscale(.9) opacity(.85);
    pointer-events: none;
    user-select: none;
  }
  .achv-info {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 4px;
    padding: 0 14px;
    color: #2b2409;
    opacity: 0;
    pointer-events: none;
  }
  .achv-info.shown {
    opacity: 1;
    animation: info-in .45s ease-out;
  }
  @keyframes info-in {
    0%   { opacity: 0; transform: translateY(7px) scale(.95); }
    100% { opacity: 1; transform: none; }
  }
  .achv-name {
    font: 700 15.5px/1.3 system-ui, "Segoe UI", sans-serif;
  }
  .achv-desc {
    font: 13px/1.45 system-ui, "Segoe UI", sans-serif;
    color: #6a5b14;
  }
  .reset-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 20;
    font: 12px/1.25 system-ui, "Segoe UI", sans-serif;
    color: #8b93a7;
    background: rgba(255, 255, 255, .05);
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 9px;
    padding: 8px 12px;
    cursor: pointer;
    transition: color .18s, background .18s, border-color .18s, transform .12s;
  }
  .reset-btn:hover {
    color: #ffd24d;
    background: rgba(255, 210, 77, .08);
    border-color: rgba(255, 210, 77, .35);
  }
  .reset-btn:active {
    transform: scale(.96);
  }

  /* ---------- Верхняя панель (Апгрейды + Дакли) ---------- */
  .top-nav {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    z-index: 25;
    user-select: none;
    white-space: nowrap;
  }
  .upgrades-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, rgba(255, 210, 77, 0.2), rgba(255, 210, 77, 0.08));
    border: 1px solid rgba(255, 210, 77, 0.4);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    color: #ffd24d;
    font: 700 14.5px/1.3 system-ui, "Segoe UI", sans-serif;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    user-select: none;
    transition: transform .12s, background .2s, border-color .2s, box-shadow .2s;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .upgrades-btn:hover {
    background: linear-gradient(135deg, rgba(255, 210, 77, 0.32), rgba(255, 210, 77, 0.16));
    border-color: #ffe082;
    box-shadow: 0 0 16px rgba(255, 210, 77, 0.35);
    transform: translateY(-1px);
  }
  .upgrades-btn:active {
    transform: scale(.96);
  }
  .shop-btn {
    display: none;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, rgba(64, 224, 208, 0.22), rgba(64, 224, 208, 0.08));
    border: 1px solid rgba(64, 224, 208, 0.45);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    color: #4ef;
    font: 700 14.5px/1.3 system-ui, "Segoe UI", sans-serif;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    user-select: none;
    transition: transform .12s, background .2s, border-color .2s, box-shadow .2s;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .shop-btn:hover {
    background: linear-gradient(135deg, rgba(64, 224, 208, 0.34), rgba(64, 224, 208, 0.16));
    border-color: #8affff;
    box-shadow: 0 0 16px rgba(64, 224, 208, 0.35);
    transform: translateY(-1px);
  }
  .shop-btn:active {
    transform: scale(.96);
  }
  .duckles-bar {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(21, 26, 38, 0.78);
    border: 1px solid rgba(255, 210, 77, 0.28);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 8px 18px;
    border-radius: 999px;
    color: #c9d1d9;
    font: 600 15.5px/1.3 system-ui, "Segoe UI", sans-serif;
    letter-spacing: .02em;
    user-select: none;
  }
  .duckles-val {
    color: #ffd24d;
    font-size: 18.5px;
    font-weight: 800;
    transition: transform .08s ease;
    display: inline-block;
  }
  .duckles-val.bump {
    transform: scale(1.22);
  }

  /* ---------- Система уровня (Справа внизу) ---------- */
  .lvl-box {
    position: fixed;
    bottom: 20px;
    right: 24px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    z-index: 25;
    user-select: none;
  }
  .lvl-title-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font: 800 15.5px/1 system-ui, "Segoe UI", sans-serif;
    color: #ffd24d;
    letter-spacing: .04em;
    text-shadow: 0 2px 10px rgba(255, 210, 77, 0.25);
  }
  .lvl-num {
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    transition: transform .15s ease;
    display: inline-block;
  }
  .lvl-bar-bg {
    width: 160px;
    height: 8px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 99px;
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
  }
  .lvl-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffb833, #ffd24d);
    border-radius: 99px;
    box-shadow: 0 0 10px rgba(255, 210, 77, 0.6);
    transition: width .25s ease-out;
  }
  .lvl-exp-text {
    font: 700 11.5px/1 system-ui, sans-serif;
    color: #8da0be;
    margin-top: 2px;
  }
  .lvl-next-unlock {
    font: 600 11px/1.25 system-ui, sans-serif;
    color: #ffd24d;
    max-width: 180px;
    text-align: right;
  }

  /* ---------- Модальное окно прокачки ---------- */
  .upgrades-modal {
    position: fixed;
    inset: 0;
    background: rgba(6, 8, 14, 0.78);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 100;
    display: none;
    place-items: center;
    padding: 16px;
    animation: modalFadeIn .2s ease-out;
  }
  .upgrades-modal.open {
    display: grid;
  }
  @keyframes modalFadeIn {
    from { opacity: 0; transform: scale(.97); }
    to { opacity: 1; transform: scale(1); }
  }
  .upgrades-dialog {
    width: min(780px, 94vw);
    max-height: min(88vh, 720px);
    background: #181d28;
    border: 1px solid #2e3648;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 30px rgba(255, 210, 77, 0.12);
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .upgrades-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid #283040;
    background: rgba(255, 255, 255, 0.02);
  }
  .upgrades-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font: 800 18px system-ui, sans-serif;
    color: #fff;
  }
  .upgrades-title-icon {
    color: #ffd24d;
  }
  .shop-title-icon {
    color: #4ef;
  }
  .shop-dialog {
    max-width: 580px;
  }
  .shop-body {
    padding: 38px 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 240px;
  }
  .shop-placeholder {
    text-align: center;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .shop-placeholder-icon {
    font-size: 54px;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
    animation: duckBob 2.4s ease-in-out infinite;
  }
  @keyframes duckBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .shop-placeholder-title {
    font: 800 20px system-ui, sans-serif;
    color: #fff;
  }
  .shop-placeholder-desc {
    font: 500 13.5px/1.55 system-ui, sans-serif;
    color: #8da0be;
  }
  .upgrades-modal-balance {
    font: 700 14px system-ui, sans-serif;
    color: #ffd24d;
    background: rgba(255, 210, 77, 0.1);
    border: 1px solid rgba(255, 210, 77, 0.25);
    padding: 4px 12px;
    border-radius: 99px;
  }
  .upgrades-close-btn {
    background: transparent;
    border: none;
    color: #8b93a7;
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
    padding: 6px;
    border-radius: 8px;
    transition: color .15s, background .15s;
  }
  .upgrades-close-btn:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.08);
  }
  .upgrades-body {
    padding: 18px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
  }
  .upgrade-card {
    background: #202736;
    border: 1px solid #2c364b;
    border-radius: 16px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    transition: border-color .2s;
  }
  .upgrade-card:hover {
    border-color: #3f4e6b;
  }
  .upgrade-info {
    flex: 1;
    min-width: 0;
  }
  .upgrade-header-line {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }
  .upgrade-name {
    font: 800 16px system-ui, sans-serif;
    color: #fff;
  }
  .upgrade-subtitle {
    font: 600 12.5px system-ui, sans-serif;
    color: #ffd24d;
  }
  .upgrade-curr-effect {
    font: 12.5px system-ui, sans-serif;
    color: #8da0be;
    margin-bottom: 4px;
  }
  .upgrade-curr-effect .effect-label {
    color: #6d7d97;
  }
  .upgrade-locked-warning {
    background: rgba(231, 76, 60, 0.14);
    border: 1px solid rgba(231, 76, 60, 0.35);
    color: #ff8577;
    font: 600 12px/1.3 system-ui, sans-serif;
    padding: 5px 10px;
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .upgrade-next-preview {
    font: 600 12.5px/1.3 system-ui, sans-serif;
    color: #ffd24d;
    margin-bottom: 4px;
    background: rgba(255, 210, 77, 0.08);
    border-left: 3px solid #ffd24d;
    padding: 4px 8px;
    border-radius: 0 6px 6px 0;
  }
  .upgrade-next-preview strong {
    color: #fff;
  }
  .upgrade-max-tag {
    font: 700 12px system-ui, sans-serif;
    color: #2ecc71;
    margin-bottom: 4px;
  }
  .upgrade-req-text {
    font: 11.5px monospace;
    color: #7b8ba5;
  }
  .upgrade-levels-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .upgrade-lvl-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 76px;
    height: 60px;
    border-radius: 12px;
    border: 1px solid #36425a;
    background: #161c28;
    color: #8da0be;
    font: 700 11px system-ui, sans-serif;
    cursor: pointer;
    transition: transform .12s, border-color .15s, background .15s, box-shadow .15s;
    user-select: none;
    text-align: center;
    padding: 3px 2px;
  }
  .upgrade-lvl-btn .lvl-tag {
    font-size: 11px;
    font-weight: 800;
  }
  .upgrade-lvl-btn .reward-tag {
    font-size: 9.5px;
    font-weight: 700;
    color: #cbd5e1;
    margin: 1px 0;
    max-width: 72px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .upgrade-lvl-btn .price-tag {
    font-size: 10px;
    font-weight: 700;
    color: #ffd24d;
  }
  .upgrade-lvl-btn.bought {
    background: rgba(46, 204, 113, 0.15);
    border-color: rgba(46, 204, 113, 0.4);
    color: #2ecc71;
    cursor: default;
  }
  .upgrade-lvl-btn.bought .reward-tag {
    color: #a3e9b9;
  }
  .upgrade-lvl-btn.bought .price-tag {
    color: #2ecc71;
  }
  .upgrade-lvl-btn.can-buy {
    background: linear-gradient(135deg, rgba(255, 210, 77, 0.22), rgba(255, 210, 77, 0.08));
    border-color: #ffd24d;
    color: #fff;
    box-shadow: 0 0 10px rgba(255, 210, 77, 0.2);
  }
  .upgrade-lvl-btn.can-buy:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 16px rgba(255, 210, 77, 0.4);
  }
  .upgrade-lvl-btn.cannot-afford {
    background: #181d27;
    border-color: #3b4559;
    color: #7a889f;
  }
  .upgrade-lvl-btn.locked {
    opacity: 0.4;
    cursor: not-allowed;
    background: #11151f;
    border-color: #202735;
  }

  @media (max-width: 560px) {
    .top-nav { top: 10px; gap: 6px; }
    .upgrades-btn { font-size: 12px; padding: 6px 12px; }
    .shop-btn { font-size: 12px; padding: 6px 12px; }
    .duckles-bar { font-size: 12.5px; padding: 6px 12px; }
    .duckles-val { font-size: 15px; }
    .lvl-box { bottom: 12px; right: 12px; }
    .lvl-bar-bg { width: 100px; height: 6px; }
    .lvl-num { font-size: 19px; }
    .upgrade-card { flex-direction: column; align-items: stretch; gap: 10px; }
    .upgrade-levels-row { justify-content: space-between; }
    .upgrade-lvl-btn { flex: 1; width: auto; height: 50px; }
    .achv-list { top: 48px; left: 0; transform: none; max-height: calc(100vh - 90px); padding: 24px 16px; }
    .achv-card { width: min(208px, calc(100vw - 32px)); height: 86px; border-radius: 20px; }
    .achv-padlock { font-size: 32px; }
    .achv-name { font-size: 14.5px; }
    .achv-desc { font-size: 12px; }
  }
</style>
</head>
<body>

  <div class="top-nav" id="topNav">
    <button id="upgradesBtn" class="upgrades-btn" aria-label="Открыть окно прокачки">
      <span class="upgrades-icon">⚡</span> Апгрейды
    </button>
    <div class="duckles-bar" id="ducklesBar">Даклей заработано: <span class="duckles-val" id="ducklesVal">0</span></div>
    <button id="shopBtn" class="shop-btn" aria-label="Открыть Магазин">
      <span class="shop-icon">🛒</span> Магазин
    </button>
  </div>

  <div class="lvl-box" id="lvlBox">
    <div class="lvl-title-row">
      <span>LVL</span> <span class="lvl-num" id="lvlNum">1</span>
    </div>
    <div class="lvl-bar-bg" title="Прогресс до следующего уровня">
      <div class="lvl-bar-fill" id="lvlBarFill"></div>
    </div>
    <div class="lvl-exp-text" id="lvlExpText">0 / 30 🦆</div>
    <div class="lvl-next-unlock" id="lvlNextUnlock">На LVL 2: Автокрякалка LVL 1</div>
  </div>

  <!-- Модальное окно прокачки -->
  <div class="upgrades-modal" id="upgradesModal">
    <div class="upgrades-dialog">
      <div class="upgrades-header">
        <div class="upgrades-title">
          <span class="upgrades-title-icon">⚡</span>
          <span>Прокачка утки</span>
        </div>
        <div class="upgrades-modal-balance">
          Баланс: <span id="modalDucklesVal">0</span> 🦆
        </div>
        <button class="upgrades-close-btn" id="closeUpgradesBtn" aria-label="Закрыть">✕</button>
      </div>
      <div class="upgrades-body" id="upgradesList"></div>
    </div>
  </div>

  <!-- Модальное окно Магазина -->
  <div class="upgrades-modal" id="shopModal">
    <div class="upgrades-dialog shop-dialog">
      <div class="upgrades-header">
        <div class="upgrades-title">
          <span class="shop-title-icon">🛒</span>
          <span>Магазин утки</span>
        </div>
        <div class="upgrades-modal-balance">
          Баланс: <span id="shopDucklesVal">0</span> 🦆
        </div>
        <button class="upgrades-close-btn" id="closeShopBtn" aria-label="Закрыть">✕</button>
      </div>
      <div class="shop-body" id="shopBody">
        <div class="shop-placeholder">
          <div class="shop-placeholder-icon">🏪</div>
          <div class="shop-placeholder-title">Полки магазина пока пустуют</div>
          <div class="shop-placeholder-desc">Здесь скоро появятся уникальные скины, шляпы и эффекты для вашей резиновой утки!</div>
        </div>
      </div>
    </div>
  </div>

  <button id="duck" aria-label="Крякнуть">
    <span class="duck-fallback">🦆</span>
    <img class="duck-img" id="duckImg" src="https://png.klev.club/uploads/posts/2024-04/png-klev-club-duug-p-rezinovaya-utka-png-14.png" alt="Резиновая утка"
         onload="document.querySelector('.duck-fallback').style.display='none'"

  function getExpForLevel(lvl) {
    if (lvl >= MAX_LEVEL) return Infinity;
    return LEVEL_EXP_TABLE[lvl] || 25000000;

  function updateDuckles(bump = false) {
    if (ducklesVal) {

  function updateShopButtonVisibility() {
    const shopBtn = document.getElementById('shopBtn');
    if (!shopBtn) return;
    if (upgradeLevels.features >= 2) {
      shopBtn.style.display = 'inline-flex';
    } else {
      shopBtn.style.display = 'none';
    }
  }

  function updateLevelDisplay(bump = false) {
    const lvlNumEl = document.getElementById('lvlNum');
    const lvlBarFill = document.getElementById('lvlBarFill');
    const lvlExpText = document.getElementById('lvlExpText');
    const lvlNextUnlock = document.getElementById('lvlNextUnlock');

    if (lvlNumEl) {
      lvlNumEl.textContent = playerLevel >= MAX_LEVEL ? (MAX_LEVEL + ' (MAX)') : playerLevel;
      if (bump) {
        lvlNumEl.style.transform = 'scale(1.35)';
        setTimeout(() => lvlNumEl.style.transform = 'none', 180);
      }
    }
    if (playerLevel >= MAX_LEVEL) {
      if (lvlBarFill) lvlBarFill.style.width = '100%';
      if (lvlExpText) lvlExpText.textContent = 'МАКСИМУМ ДОСТИГНУТ';
      if (lvlNextUnlock) lvlNextUnlock.textContent = '🏆 Все улучшения открыты!';
    } else {
      const req = getExpForLevel(playerLevel);
      const pct = Math.min(100, Math.max(0, (playerExp / req) * 100));
      if (lvlBarFill) lvlBarFill.style.width = pct + '%';
      if (lvlExpText) {
        lvlExpText.textContent = `${Math.floor(playerExp).toLocaleString('ru-RU')} / ${req.toLocaleString('ru-RU')} 🦆`;
      }
      if (lvlNextUnlock) {
        const nextInfo = LEVEL_UNLOCKS_INFO[playerLevel + 1] || 'Новые рубежи';
        lvlNextUnlock.textContent = `На LVL ${playerLevel + 1}: ${nextInfo}`;
      }
    }
  }

  function addDuckles(amount) {
    if (amount <= 0) return;
    duckles += amount;
    try { localStorage.setItem(DUCKLES_KEY, String(duckles)); } catch (e) {}
    updateDuckles(true);

    // Опыт и уровни (максимум 20)
    if (playerLevel < MAX_LEVEL) {
      playerExp += amount;
      let expForNext = getExpForLevel(playerLevel);
      let leveledUp = false;

      while (playerLevel < MAX_LEVEL && playerExp >= expForNext) {
        playerExp -= expForNext;
        playerLevel++;
        leveledUp = true;
        expForNext = getExpForLevel(playerLevel);
      }

      if (leveledUp) {
        const lvlBox = document.getElementById('lvlNum');
        if (lvlBox) {
          const r = lvlBox.getBoundingClientRect();
          spawnLvlUp(r.left + r.width / 2, r.top);
        }
        xpSound();
        try { localStorage.setItem(LEVEL_KEY, String(playerLevel)); } catch (e) {}
      }
      try { localStorage.setItem(EXP_KEY, String(playerExp)); } catch (e) {}
      updateLevelDisplay(leveledUp);
    }
    renderUpgrades();
    tryUnlock();
  }

  function spawnLvlUp(x, y) {
    const count = 5 + (Math.random() * 4 | 0);
    for (let i = 0; i < count; i++) {
      const ang = 0.25 + Math.random() * Math.PI * 0.5;
      const speed = 190 + Math.random() * 260;
      particles.push({
        x: x + (Math.random() - .5) * 44,
        y: y + (Math.random() - .5) * 14,
        vx: Math.cos(ang) * speed,
        vy: -Math.sin(ang) * speed,
        size: 18 + Math.random() * 12,
        alpha: 1,
        text: 'LVL UP!',
        color: '#ffd24d'
      });
    }
  }

  function tryUnlock() {
    ACHIEVEMENTS.forEach((a, i) => {
      if (!a.done && a.check()) unlockAchievement(i);
    });
  }

  function unlockAchievement(i) {
    const a = ACHIEVEMENTS[i];
    a.done = true;
    try {
      localStorage.setItem(STORAGE_PREFIX + a.id, '1');
    } catch (e) { /* без сохранения тоже ок */ }

    const card = document.getElementById('achv-card-' + a.id);
    const padlock = document.getElementById('achv-padlock-' + a.id);
    const info = document.getElementById('achv-info-' + a.id);
    const r = padlock.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;

    // опыт: звук как в Minecraft
    xpSound();

    // окно подсвечивается жёлтым; название и описание появляются чуть позже
    card.classList.add('unlocked');
    card.classList.add('flash');
    card.addEventListener('animationend', () => card.classList.remove('flash'), { once: true });
    setTimeout(() => info.classList.add('shown'), 220);

    // замок отлетает как «Кря»
    padlock.style.display = 'none';
    const ang = 0.15 + Math.random() * Math.PI * 0.85;
    const speed = 240 + Math.random() * 260;
    particles.push({
      x: cx,
      y: cy,
      vx: Math.cos(ang) * speed,
      vy: -Math.sin(ang) * speed,
      size: 44,
      alpha: 1,
      hue: 0,
      sat: 0,
      light: 50,
      fly: true,
      rot: 0,
      rotSpeed: (Math.random() - 0.5) * 14,
    });
  }

  function xpSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t0 = audioCtx.currentTime + 0.02;
      // короткий восходящий арпеджио — «пинг-пинг-пинг», как при сборе опыта
      const notes = [523.25, 659.25, 783.99, 880.0, 1046.5];
      notes.forEach((f, n) => {
        const st = t0 + n * 0.068;
        const o = audioCtx.createOscillator();
        o.type = 'square';
        o.frequency.setValueAtTime(f, st);
        o.frequency.exponentialRampToValueAtTime(f * 0.9, st + 0.045);
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.0001, st);
        g.gain.exponentialRampToValueAtTime(0.08, st + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, st + 0.055);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start(st);
        o.stop(st + 0.07);
      });
    } catch (e) { /* без звука тоже ок */ }
  }

  /* ---------- Логика апгрейдов и автокрякалки ---------- */
  function updateAutoQuackTimer() {
    if (autoQuackTimer) clearInterval(autoQuackTimer);
    // Прокачка Автокрякалка не доступна пока не прокачен 1 LVL Возможности
    if (upgradeLevels.features < 1) return;
    const lvl = upgradeLevels.autoquack;
    if (lvl <= 0) return; // По умолчанию без дохода

    const autoUpg = UPGRADES_DATA.find(u => u.id === 'autoquack');
    if (!autoUpg) return;
    let rate = autoUpg.levels[lvl - 1].rate;

    // Возможности ур 5: Золотая утка (x2 ко всему доходу)
    if (upgradeLevels.features >= 5) {
      rate *= 2;
    }

    // Возможности ур 3: Турбо-кряк (в 2 раза чаще — каждые 750мс вместо 1500мс)
    const intervalMs = (upgradeLevels.features >= 3) ? 750 : 1500;
    const gainPerTick = (upgradeLevels.features >= 3) ? (rate / 2) : rate;

    autoQuackTimer = setInterval(() => {
      addDuckles(gainPerTick);
    }, intervalMs);
  }

  function buyUpgrade(upgradeId, targetLvl) {
    // Прокачка Автокрякалка не доступна пока не прокачен 1 LVL Возможности
    if (upgradeId === 'autoquack' && upgradeLevels.features < 1) return;

    const upg = UPGRADES_DATA.find(u => u.id === upgradeId);
    if (!upg) return;
    const currentLvl = upgradeLevels[upgradeId] || 0;
    if (targetLvl !== currentLvl + 1) return;
    const lvlData = upg.levels[targetLvl - 1];
    if (!lvlData) return;

    if (playerLevel < lvlData.reqLvl || duckles < lvlData.cost) return;

    duckles -= lvlData.cost;
    upgradeLevels[upgradeId] = targetLvl;

    try {
      localStorage.setItem(DUCKLES_KEY, String(duckles));
      localStorage.setItem('duck-upg-' + upgradeId, String(targetLvl));
    } catch (e) {}

    xpSound();
    updateDuckles(true);
    updateAutoQuackTimer();
    renderUpgrades();
    updateLevelDisplay();
    updateShopButtonVisibility();
    tryUnlock();
  }
  window.buyUpgrade = buyUpgrade;

  function renderUpgrades() {
    const container = document.getElementById('upgradesList');
    if (!container) return;
    container.innerHTML = '';

    UPGRADES_DATA.forEach(upg => {
      const curLvl = upgradeLevels[upg.id] || 0;
      const card = document.createElement('div');
      card.className = 'upgrade-card';

      const isBranchLocked = (upg.id === 'autoquack' && upgradeLevels.features < 1);

      // Текущий эффект
      let currText = 'Не приобретено (нет бонуса)';
      if (curLvl > 0) {
        currText = upg.levels[curLvl - 1].text;
      }

      // Блок предупреждения блокировки ветки
      let warningHtml = '';
      if (isBranchLocked) {
        warningHtml = `
          <div class="upgrade-locked-warning">
            🔒 Заблокировано: сначала прокачайте «Возможности» LVL 1 (Открывает автокрякалку)
          </div>
        `;
      }

      // Что даст следующий уровень
      let nextBonusHtml = '';
      let reqHtml = '';
      if (curLvl < 5) {
        const nextLvlData = upg.levels[curLvl];
        nextBonusHtml = `
          <div class="upgrade-next-preview">
            ⚡ Следующий LVL ${curLvl + 1}: <strong>${nextLvlData.text}</strong>
          </div>
        `;
        let condText = `Требуется: ${nextLvlData.cost.toLocaleString('ru-RU')} 🦆 • LVL ${nextLvlData.reqLvl} игрока`;
        if (isBranchLocked) {
          condText = `Требуется: «Возможности» LVL 1 • ${nextLvlData.cost.toLocaleString('ru-RU')} 🦆 • LVL ${nextLvlData.reqLvl} игрока`;
        }
        reqHtml = `<div class="upgrade-req-text">${condText}</div>`;
      } else {
        nextBonusHtml = `<div class="upgrade-max-tag">⭐ Прокачано на максимум (5/5)</div>`;
      }

      const infoHtml = `
        <div class="upgrade-info">
          <div class="upgrade-header-line">
            <span class="upgrade-name">${upg.name}</span>
            <span class="upgrade-subtitle">• ${upg.desc}</span>
          </div>
          ${warningHtml}
          <div class="upgrade-curr-effect">
            <span class="effect-label">Текущий бонус:</span> ${currText}
          </div>
          ${nextBonusHtml}
          ${reqHtml}
        </div>
      `;

      let btnsHtml = '<div class="upgrade-levels-row">';
      for (let l = 1; l <= 5; l++) {
        const lvlData = upg.levels[l - 1];
        if (l <= curLvl) {
          btnsHtml += `
            <button class="upgrade-lvl-btn bought" disabled title="LVL ${l}: ${lvlData.text} (Приобретено)">
              <span class="lvl-tag">LVL ${l}</span>
              <span class="reward-tag">${lvlData.short}</span>
              <span class="price-tag">✓ Куплено</span>
            </button>
          `;
        } else if (l === curLvl + 1) {
          if (isBranchLocked) {
            btnsHtml += `
              <button class="upgrade-lvl-btn locked" disabled title="Требуется открыть «Возможности» LVL 1">
                <span class="lvl-tag">LVL ${l}</span>
                <span class="reward-tag">${lvlData.short}</span>
                <span class="price-tag">🔒 Блок</span>
              </button>
            `;
          } else {
            const hasLevel = playerLevel >= lvlData.reqLvl;
            const canAfford = duckles >= lvlData.cost;
            if (!hasLevel) {
              btnsHtml += `
                <button class="upgrade-lvl-btn locked" disabled title="${lvlData.text} — требуется уровень игрока ${lvlData.reqLvl}">
                  <span class="lvl-tag">LVL ${l}</span>
                  <span class="reward-tag">${lvlData.short}</span>
                  <span class="price-tag">🔒 ур.${lvlData.reqLvl}</span>
                </button>
              `;
            } else {
              const btnClass = canAfford ? 'upgrade-lvl-btn can-buy' : 'upgrade-lvl-btn cannot-afford';
              btnsHtml += `
                <button class="${btnClass}" onclick="buyUpgrade('${upg.id}', ${l})" title="Купить: ${lvlData.text} за ${lvlData.cost} Даклей">
                  <span class="lvl-tag">LVL ${l}</span>
                  <span class="reward-tag">${lvlData.short}</span>
                  <span class="price-tag">${lvlData.cost.toLocaleString('ru-RU')} 🦆</span>
                </button>
              `;
            }
          }
        } else {
          btnsHtml += `
            <button class="upgrade-lvl-btn locked" disabled title="LVL ${l}: ${lvlData.text} — сначала купите LVL ${l - 1}">
              <span class="lvl-tag">LVL ${l}</span>
              <span class="reward-tag">${lvlData.short}</span>
              <span class="price-tag">🔒</span>
            </button>
          `;
        }
      }
      btnsHtml += '</div>';

      card.innerHTML = infoHtml + btnsHtml;
      container.appendChild(card);
    });
  }

  // Открытие/закрытие окна апгрейдов
  const upgradesBtn = document.getElementById('upgradesBtn');
  const upgradesModal = document.getElementById('upgradesModal');
  const closeUpgradesBtn = document.getElementById('closeUpgradesBtn');

  if (upgradesBtn && upgradesModal && closeUpgradesBtn) {
    upgradesBtn.addEventListener('click', () => {
      renderUpgrades();
      upgradesModal.classList.add('open');
    });
    closeUpgradesBtn.addEventListener('click', () => {
      upgradesModal.classList.remove('open');
    });
    upgradesModal.addEventListener('click', (e) => {
      if (e.target === upgradesModal) {
        upgradesModal.classList.remove('open');
      }
    });
  }

  // Открытие/закрытие окна магазина
  const shopBtn = document.getElementById('shopBtn');
  const shopModal = document.getElementById('shopModal');
  const closeShopBtn = document.getElementById('closeShopBtn');

  if (shopBtn && shopModal && closeShopBtn) {
    shopBtn.addEventListener('click', () => {
      updateDuckles();
      shopModal.classList.add('open');
    });
    closeShopBtn.addEventListener('click', () => {
      shopModal.classList.remove('open');
    });
    shopModal.addEventListener('click', (e) => {
      if (e.target === shopModal) {
        shopModal.classList.remove('open');
      }
    });
  }


  /* ---------- canvas ---------- */
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width  = innerWidth  * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  /* ---------- звук "кря" ---------- */
  function quack() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc = (type, f0, f1, dur, gain) => {
        const o = audioCtx.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(f0, t);
        o.frequency.exponentialRampToValueAtTime(f1, t + dur);
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(gain, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.04);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + dur + 0.08);
      };
      // базовой "квак": падение высоты + щепетотка
      osc('sawtooth', 340 + Math.random() * 130, 70, 0.16, 0.10);
      osc('square',   560 + Math.random() * 160, 130, 0.11, 0.05);
      const nLen = Math.max(1, 0.02 * audioCtx.sampleRate | 0);
      const buf = audioCtx.createBuffer(1, nLen, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < nLen; i++) d[i] = (Math.random() * 2 - 1) * 0.8;
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.06, t);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.025);
      src.connect(ng); ng.connect(audioCtx.destination);
      src.start(t);
    } catch (e) { /* без звука тоже ок */ }
  }

  /* ---------- частицы "Кря" ---------- */
  function spawn(x, y) {
    const n = 8 + (Math.random() * 8 | 0);          // 8..15 за раз (+10%)
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI;          // 0°..180° — весь верхний разброс
      const speed = 90 + Math.random() * 380;       // случайная начальная скорость
      particles.push({
        x: x + (Math.random() - .5) * 26,
        y: y + (Math.random() - .5) * 18,
        vx: Math.cos(ang) * speed,
        vy: -Math.sin(ang) * speed,
        size: 14 + Math.random() * 32,              // случайный размер
        alpha: .18 + Math.random() * .72,           // уменьшенный нижний диапазон прозрачности (0.18..0.90)
        hue: Math.random() * 360 | 0,               // случайный цвет
        sat: 65 + Math.random() * 35 | 0,
        light: 55 + Math.random() * 22 | 0,
      });
    }
  }

  duck.addEventListener('click', () => {
    const r = duck.getBoundingClientRect();
    // анимация "подпрыгивания" — перезапуск
    duck.classList.remove('pop');
    void duck.offsetWidth;
    duck.classList.add('pop');
    quack();
    quackCount++;

    // Расчет силы клика и возможностей
    let gain = 1;
    const strUpg = UPGRADES_DATA.find(u => u.id === 'strength');
    const strLvl = upgradeLevels.strength;
    if (strUpg && strLvl > 0) {
      gain = strUpg.levels[strLvl - 1].power;
    }

    // Возможности ур 4: Дак-Магнит (каждые 25 кликов +150 Даклей)
    if (upgradeLevels.features >= 4 && quackCount % 25 === 0) {
      gain += 150;
      particles.push({
        x: r.left + r.width / 2,
        y: r.top + 20,
        vx: 0,
        vy: -150,
        size: 20,
        alpha: 1,
        text: '+150 🦆',
        color: '#ffdd55'
      });
    }

    // Возможности ур 5: Золотая утка (x2 ко всему)
    if (upgradeLevels.features >= 5) {
      gain *= 2;
    }

    addDuckles(gain);
    try {
      localStorage.setItem(QUACK_KEY, String(quackCount));
    } catch (e) {}

    // Нажатие сбрасывает таймер ожидания (нужно навестись и не нажимать 10 сек)
    clearHoverTimer();
    startHoverTimer();

    // старт из клюва/горловины утки
    spawn(r.left + r.width / 2, r.top + r.height * 0.58);
    // проверка ачивок
    tryUnlock();
  });

  // клик по нижней надписи — «не туда»: текст не меняется, просто считаем и проверяем ачивку
  const hint = document.querySelector('.hint');
  hint.addEventListener('click', () => {
    hintCount++;
    try { localStorage.setItem(HINT_KEY, String(hintCount)); } catch (e) {}
    tryUnlock();
  });

  // клик по заблокированной ачивке — ачивка "Взлом жопы!"
  document.getElementById('achvList').addEventListener('click', (e) => {
    const card = e.target.closest('.achv-card');
    if (card && !card.classList.contains('unlocked')) {
      lockedCardClicked = true;
      try { localStorage.setItem(LOCKED_CLICKED_KEY, '1'); } catch (err) {}
      tryUnlock();
    }
  });

  // ачивка "Томное ожидание": навестись на утку и не нажимать 10 секунд
  function startHoverTimer() {
    clearHoverTimer();
    if (hoverWaitDone) return;
    hoverTimer = setTimeout(() => {
      hoverWaitDone = true;
      try { localStorage.setItem(HOVER_WAIT_KEY, '1'); } catch (e) {}
      tryUnlock();
    }, 10000);
  }
  function clearHoverTimer() {
    if (hoverTimer) {
      clearTimeout(hoverTimer);
      hoverTimer = null;
    }
  }
  duck.addEventListener('pointerenter', startHoverTimer);
  duck.addEventListener('pointerleave', clearHoverTimer);

  // Запрет контекстного меню (ПКМ -> Посмотреть код)
  window.addEventListener('contextmenu', (e) => {
    e.preventDefault();
  });

  // Анти-отладчик: если DevTools открыт, выполнение замирает на точке останова
  setInterval(() => {
    const t0 = performance.now();
    debugger;
    if (performance.now() - t0 > 80) {
      triggerDevTools();
    }
  }, 100);

  // ачивка "Хакер": открытие DevTools
  function triggerDevTools() {
    if (!devToolsOpened) {
      devToolsOpened = true;
      try { localStorage.setItem(DEVTOOLS_KEY, '1'); } catch (e) {}
      tryUnlock();
    }
  }

  // Отслеживание открытия DevTools по событию resize:
  // При открытии встроенной панели DevTools размер окна браузера (outer) не меняется,
  // а внутренняя область страницы (inner) резко уменьшается (> 140px).
  let prevOuterW = window.outerWidth;
  let prevOuterH = window.outerHeight;
  let prevInnerW = window.innerWidth;
  let prevInnerH = window.innerHeight;

  window.addEventListener('resize', () => {
    const deltaOuterW = Math.abs(window.outerWidth - prevOuterW);
    const deltaOuterH = Math.abs(window.outerHeight - prevOuterH);
    const deltaInnerW = Math.abs(window.innerWidth - prevInnerW);
    const deltaInnerH = Math.abs(window.innerHeight - prevInnerH);

    prevOuterW = window.outerWidth;
    prevOuterH = window.outerHeight;
    prevInnerW = window.innerWidth;
    prevInnerH = window.innerHeight;

    if ((deltaInnerW > 140 && deltaOuterW < 25) || (deltaInnerH > 140 && deltaOuterH < 25)) {
      triggerDevTools();
    }
  });

  // клавиатурные ачивки: "Печатать не нужно!", "Я и есть утка", "Поганец!", "Хакер"
  const DUCK_SEQUENCE = [
    { code: 'KeyR', keys: ['r', 'к'] },
    { code: 'KeyH', keys: ['h', 'р'] },
    { code: 'KeyZ', keys: ['z', 'я'] },
  ];
  let duckSeqIndex = 0;

  function isFunctionalKey(e) {
    if (/^F\d+$/.test(e.key)) return true;
    const functional = [
      'Shift', 'Control', 'Alt', 'Meta', 'AltGraph',
      'CapsLock', 'Tab', 'Escape', 'NumLock', 'ScrollLock',
      'Pause', 'PrintScreen', 'ContextMenu'
    ];
    return functional.includes(e.key);
  }

  window.addEventListener('keydown', (e) => {
    // 0. "Хакер" — блокировка вызова DevTools и просмотра исходного кода
    if (e.key === 'F12' ||
        ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.code === 'KeyI' || e.code === 'KeyJ' || e.code === 'KeyC')) ||
        ((e.ctrlKey || e.metaKey) && (e.code === 'KeyU' || e.key.toLowerCase() === 'u' || e.key.toLowerCase() === 'г'))) {
      e.preventDefault();
      e.stopPropagation();
      triggerDevTools();
      return false;
    }

    if (e.repeat) return;

    // 1. "Печатать не нужно!" — любая нефункциональная клавиша
    if (!isFunctionalKey(e)) {
      if (!keyPressed) {
        keyPressed = true;
        try { localStorage.setItem(KEY_PRESSED_KEY, '1'); } catch (err) {}
        tryUnlock();
      }
    }

    // 2. "Я и есть утка" — последовательность R H Z (К Р Я)
    const pressedKey = e.key.toLowerCase();
    const step = DUCK_SEQUENCE[duckSeqIndex];
    if (e.code === step.code || step.keys.includes(pressedKey)) {
      duckSeqIndex++;
      if (duckSeqIndex === DUCK_SEQUENCE.length) {
        duckSeqDone = true;
        duckSeqIndex = 0;
        try { localStorage.setItem(SEQ_DONE_KEY, '1'); } catch (err) {}
        tryUnlock();
      }
    } else {
      if (e.code === DUCK_SEQUENCE[0].code || DUCK_SEQUENCE[0].keys.includes(pressedKey)) {
        duckSeqIndex = 1;
      } else {
        duckSeqIndex = 0;
      }
    }

    // 3. "Поганец!" — слова {EQ, GBPLF, PFKEGF, <KZ и русский эквивалент
    if (e.key.length === 1) {
      charBuffer = (charBuffer + e.key.toLowerCase()).slice(-30);
      codeBuffer = (codeBuffer + e.code).slice(-60);

      const badPatterns = [
        '{eq', '[eq', 'хуй',
        'gbplf', 'пизда',
        'pfkegf', 'залупа',
        '<kz', ',kz', 'бля'
      ];
      const codePatterns = [
        'BracketLeftKeyEKeyQ',
        'KeyGKeyBKeyPKeyLKeyF',
        'KeyPKeyFKeyKKeyEKeyGKeyF',
        'CommaKeyKKeyZ'
      ];

      if (!badWordsTyped && (badPatterns.some(p => charBuffer.includes(p)) ||
                             codePatterns.some(p => codeBuffer.includes(p)))) {
        badWordsTyped = true;
        try { localStorage.setItem(BAD_WORDS_KEY, '1'); } catch (err) {}
        tryUnlock();
      }
    }
  });

  // сброс всех ачивок
  document.getElementById('resetBtn').addEventListener('click', resetAchievements);

  /* ---------- инициализация ---------- */
  buildAchievementCards();
  updateDuckles();
  updateLevelDisplay();
  updateAutoQuackTimer();
  renderUpgrades();
  updateShopButtonVisibility();
  tryUnlock();

  /* ---------- цикл ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    ctx.clearRect(0, 0, innerWidth, innerHeight);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += GRAVITY * dt;          // тяжение
      p.x  += p.vx * dt;
      p.y  += p.vy * dt;
      if (p.fly) p.rot += p.rotSpeed * dt;

      // улетели за экран — убираем
      if (p.x < -60 || p.x > innerWidth + 60 || p.y > innerHeight + 80 || p.y < -200) {
        particles.splice(i, 1);
        continue;
      }

      if (p.fly) {
        // замок летит по той же траектории, что и «Кря»
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = p.size + 'px "Segoe UI Emoji", "Segoe UI Symbol", system-ui';
        ctx.fillText('🔒', 0, 0);
        ctx.restore();
      } else if (p.text) {
        p.alpha -= 0.65 * dt;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.font = '800 ' + p.size + 'px system-ui, "Segoe UI", sans-serif';
        ctx.fillStyle = p.color || '#ffd24d';
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.shadowColor = 'rgba(255, 210, 77, 0.7)';
        ctx.shadowBlur = 12;
        ctx.textAlign = 'center';
        ctx.fillText(p.text, p.x, p.y);
        ctx.restore();
      } else {
        ctx.font = 'bold ' + p.size + 'px "Segoe UI", system-ui, sans-serif';
        ctx.fillStyle = 'hsla(' + p.hue + ', ' + p.sat + '%, ' + p.light + '%, ' + p.alpha + ')';
        ctx.fillText('Кря', p.x, p.y);
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
